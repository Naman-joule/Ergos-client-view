# Secret "ergos-view-sync" must hold ERGOS_DATABASE_URL and TARGET_DATABASE_URL
# (and optionally MASTER_DATABASE_URL and IEX_DATABASE_URL, read-only users on the regulatory master and IEX DBs)
# (optionally SYNC_WINDOW_DAYS, SYNC_STALE_MINUTES). Create it with kubectl, never commit it:
#   kubectl create secret generic ergos-view-sync --from-env-file=sync/.env
# Image: build on the node (or push to your registry) with a fixed tag, e.g.
#   docker build -t ergos-view-sync:1 sync/
# A ":latest" tag makes Kubernetes always try to pull from a registry, so a locally built image never starts.
# Schedules are evaluated in the cluster's time zone; the minutes do not depend on it.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ergos-view-sync-fast
spec:
  schedule: "4,19,34,49 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 600
      template:
        spec:
          restartPolicy: Never
          securityContext: { runAsNonRoot: true, runAsUser: 10001 }
          containers:
            - name: sync
              image: ergos-view-sync:1   # or your-registry/ergos-view-sync:<tag>
              imagePullPolicy: IfNotPresent
              args: ["--tier", "fast"]
              envFrom: [{ secretRef: { name: ergos-view-sync } }]
              resources:
                requests: { cpu: 100m, memory: 128Mi }
                limits: { memory: 512Mi }
---
# ergOS recalculates savings for past days (e.g. the whole month at ~01:45 IST), long after the fast tier's
# 10-day window has moved on. Twice a day, re-copy the last 120 days of savings statements so late corrections
# and newly priced days reach the client view; window mode also drops rows ergOS has deleted.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ergos-view-sync-savings
spec:
  schedule: "17 3,15 * * *"
  timeZone: Asia/Kolkata
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 1800
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 900
      template:
        spec:
          restartPolicy: Never
          securityContext: { runAsNonRoot: true, runAsUser: 10001 }
          containers:
            - name: sync
              image: ergos-view-sync:2   # use the same tag as ergos-view-sync-fast
              imagePullPolicy: IfNotPresent
              args: ["--tier", "fast", "--tables", "iex_tod_daily_obligation", "--backfill-days", "120"]
              envFrom: [{ secretRef: { name: ergos-view-sync } }]
              resources:
                requests: { cpu: 100m, memory: 128Mi }
                limits: { memory: 512Mi }
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ergos-view-sync-slow
spec:
  schedule: "11 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        spec:
          restartPolicy: Never
          securityContext: { runAsNonRoot: true, runAsUser: 10001 }
          containers:
            - name: sync
              image: ergos-view-sync:1
              imagePullPolicy: IfNotPresent
              args: ["--tier", "slow"]
              envFrom: [{ secretRef: { name: ergos-view-sync } }]
              resources:
                requests: { cpu: 100m, memory: 128Mi }
                limits: { memory: 512Mi }
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ergos-view-sync-freshness
spec:
  schedule: "*/10 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        spec:
          restartPolicy: Never
          securityContext: { runAsNonRoot: true, runAsUser: 10001 }
          containers:
            - name: freshness
              image: ergos-view-sync:1
              imagePullPolicy: IfNotPresent
              args: ["--freshness"]
              envFrom: [{ secretRef: { name: ergos-view-sync } }]
              resources:
                requests: { cpu: 50m, memory: 64Mi }
